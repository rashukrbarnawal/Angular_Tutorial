name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-validation:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "📝 PR Title: $PR_TITLE"
          if [[ ${#PR_TITLE} -lt 5 ]]; then
            echo "⚠️  PR title might be too short"
          else
            echo "✅ PR title is valid"
          fi

      - name: Check for description
        run: |
          if [ -z "${{ github.event.pull_request.body }}" ]; then
            echo "⚠️  PR description is empty"
          else
            echo "✅ PR has a description"
          fi

  file-changes:
    name: Analyze File Changes
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          echo "📊 Changed Files Analysis"
          git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD
          echo ""
          echo "Changed files count: $(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD | wc -l)"

      - name: Check for CSS changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD | grep -q "\.css$"; then
            echo "✅ CSS files modified"
          else
            echo "ℹ️  No CSS files modified"
          fi

      - name: Check for JavaScript changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD | grep -q "\.js$"; then
            echo "✅ JavaScript files modified"
          else
            echo "ℹ️  No JavaScript files modified"
          fi

  size-check:
    name: Check PR Size
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze PR size
        run: |
          LINES_ADDED=$(git diff ${{ github.event.pull_request.base.sha }}..HEAD --stat | tail -1 | awk '{print $4}')
          LINES_REMOVED=$(git diff ${{ github.event.pull_request.base.sha }}..HEAD --stat | tail -1 | awk '{print $6}')
          FILES_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD | wc -l)
          
          echo "📈 PR Size Metrics"
          echo "- Files changed: $FILES_CHANGED"
          echo "- Lines added: $LINES_ADDED"
          echo "- Lines removed: $LINES_REMOVED"
          
          if [ "$FILES_CHANGED" -gt 20 ]; then
            echo "⚠️  Large PR detected (>20 files changed)"
          else
            echo "✅ PR size is reasonable"
          fi

  comment-pr:
    name: Add PR Comment with Status
    runs-on: ubuntu-latest
    needs: [pr-validation, file-changes, size-check]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Comment PR with check status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prValidation = '${{ needs.pr-validation.result }}';
            const fileChanges = '${{ needs.file-changes.result }}';
            const sizeCheck = '${{ needs.size-check.result }}';
            
            let statusEmoji = '✅';
            if (prValidation === 'failure' || fileChanges === 'failure' || sizeCheck === 'failure') {
              statusEmoji = '❌';
            }
            
            const comment = `## ${statusEmoji} CI Checks Status
            
            | Check | Status |
            |-------|--------|
            | PR Validation | ${{ needs.pr-validation.result }} |
            | File Changes | ${{ needs.file-changes.result }} |
            | Size Check | ${{ needs.size-check.result }} |
            
            ### ℹ️ Details
            - **Ref**: ${{ github.ref }}
            - **Commit**: ${{ github.sha }}
            - **Author**: ${{ github.actor }}
            
            All automated checks have been completed. Please review the results above.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

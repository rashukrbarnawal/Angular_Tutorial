name: Syntax Check on PR

on:
  pull_request:
    branches:
      - main

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Check JavaScript syntax
        run: |
          echo "Checking JavaScript files for syntax errors..."
          
          # Check each JavaScript file
          for file in Day2.js index.js asyncExample.js; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              node -c "$file" || exit 1
            fi
          done
          
          echo "✓ All JavaScript files have valid syntax!"
      
      - name: Validate YAML workflow files
        run: |
          echo "Validating YAML workflow files..."
          
          # Use node to parse and validate YAML
          npm install -g js-yaml > /dev/null 2>&1
          
          for file in .github/workflows/*.yml; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              node -e "require('js-yaml').load(require('fs').readFileSync('$file', 'utf8'))" || exit 1
            fi
          done
          
          echo "✓ All YAML files are valid!"
      
      - name: Summary
        run: echo "✓ All checks passed successfully!"
